name: Continuous Integration Pipeline
# NicDevelopment 
on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw -B -ntp clean test

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-check:
    name: Frontend Lint, Type Check, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      # INSANELY STRICT LINTING AND TYPE CHECKING 
      # BEING A PAIN TO FIX when small lint errors pop up, but will ensure high code quality and consistency

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend type check
        working-directory: ./frontend
        run: npm run type-check
        continue-on-error: true

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build-only

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-check
    services:
      backend:
        image: openjdk:21-slim
        options: >-
          --health-cmd="curl -f http://localhost:8080/api/v1/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start backend server
        working-directory: ./backend
        run: ./mvnw spring-boot:run &
        env:
          SERVER_PORT: 8080

      - name: Wait for backend to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: ./frontend
        run: npm run dev &
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run frontend E2E tests
        working-directory: ./frontend
        run: npm run test:e2e -- --project=chromium --workers=2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
