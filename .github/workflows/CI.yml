name: Continuous Integration Pipeline
# NicDevelopment 
on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run Super-Linter with output to JSON format
      # Run Super-Linter with direct output capture
      - name: Run Super Linter
        id: linter
        uses: github/super-linter@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true
          VALIDATE_JAVA: true 
          VALIDATE_TYPESCRIPT: true
          VALIDATE_JAVASCRIPT: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: Dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the API ESLint config for API JS files (enforces semicolons)
          ESLINT_CONFIG_FILE_API: ./API/.eslintrc.json
          # Use the frontend ESLint config for TS/TSX/Cypress files
          ESLINT_CONFIG_FILE_FRONTEND: ./frontend/.eslintrc.json
          FILTER_REGEX_EXCLUDE: ".*node_modules/.*"
          # Enable debuggable output
          LOG_LEVEL: ERROR
          # Continue even when finding errors to see all errors
          DISABLE_ERRORS: true
  
  test-backend:
    name: Backend Tests (Unit, Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for backend build
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # - name: Build Backend
      #   working-directory: ./backend
      #   run: ./mvnw clean package -DskipTests

      # - name: Run Java tests
      #   working-directory: ./backend
      #   run: ./mvnw test

      # - name: Upload test reports
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-test-reports
      #     path: backend/target/surefire-reports/

  test-ui:
    name: UI Tests (Component & E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 
          cache: 'npm'
          cache-dependency-path: |
            ./frontend/package-lock.json
  
      # Add caching for dependencies to speed up workflow      
      - name: Install UI dependencies
        working-directory: ./frontend
        run: |
          npm install
          echo "Frontend dependencies installed successfully"
          npm run test:unit
          echo "Unit tests completed successfully"
