name: Continuous Integration Pipeline
# NicDevelopment 
on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw -B -ntp clean test

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-check:
    name: Frontend Lint, Type Check, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # INSANELY STRICT LINTING AND TYPE CHECKING
      # BEING A PAIN TO FIX when small lint errors pop up, but will ensure high code quality and consistency

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend type check
        working-directory: ./frontend
        run: npm run type-check
        continue-on-error: true

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build-only

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

